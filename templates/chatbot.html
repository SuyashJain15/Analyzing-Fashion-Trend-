<!-- Chatbot Widget -->
<div class="chatbot-widget" id="chatbotWidget">
  <div class="chatbot-header" onclick="toggleChatbot()">
    <div class="d-flex align-items-center gap-2">
      <span style="font-size: 1.5rem;">💬</span>
      <span style="font-weight: 800;">Fashion Advisor</span>
    </div>
    <span id="chatbotToggle">–</span>
  </div>
  
  <div class="chatbot-body" id="chatbotBody">
    <div class="chatbot-messages" id="chatbotMessages">
      <div class="message bot-message">
        <div class="message-avatar">🤖</div>
        <div class="message-content">
          <p>Hello! I'm your fashion advisor. Ask me about:</p>
          <ul style="margin: 0; padding-left: 1.2rem;">
            <li>🎨 Color suggestions</li>
            <li>⌚ Accessories</li>
            <li>🔥 Current trends</li>
            <li>👔 Outfit tips</li>
          </ul>
        </div>
      </div>
    </div>
    
    <div class="chatbot-input-area">
      <input type="text" id="chatbotInput" placeholder="Ask me anything about fashion..." class="chatbot-input">
      <button onclick="sendChatMessage()" class="btn btn-send">📤</button>
    </div>
  </div>
</div>

<style>
.chatbot-widget {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 380px;
  max-height: 600px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(20px);
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: all 0.3s ease;
}

.chatbot-header {
  background: linear-gradient(135deg, #6366f1, #ec4899);
  color: white;
  padding: 1rem 1.5rem;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 700;
}

.chatbot-header:hover {
  background: linear-gradient(135deg, #4f46e5, #db2777);
}

.chatbot-body {
  display: flex;
  flex-direction: column;
  height: 500px;
  transition: all 0.3s ease;
}

.chatbot-body.collapsed {
  height: 0;
  opacity: 0;
}

.chatbot-messages {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.message {
  display: flex;
  gap: 0.75rem;
  animation: slideIn 0.3s ease;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  flex-shrink: 0;
}

.bot-message .message-avatar {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
}

.user-message {
  flex-direction: row-reverse;
}

.user-message .message-avatar {
  background: linear-gradient(135deg, #f59e0b, #fbbf24);
}

.message-content {
  flex: 1;
  padding: 0.75rem 1rem;
  border-radius: 12px;
  background: #f8fafc;
  color: #1e293b;
  font-weight: 600;
}

.bot-message .message-content {
  background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
}

.user-message .message-content {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(251, 191, 36, 0.1));
}

.chatbot-input-area {
  display: flex;
  gap: 0.5rem;
  padding: 1rem;
  border-top: 1px solid rgba(0, 0, 0, 0.1);
}

.chatbot-input {
  flex: 1;
  border: 2px solid rgba(99, 102, 241, 0.2);
  border-radius: 12px;
  padding: 0.75rem 1rem;
  font-weight: 600;
  transition: all 0.3s ease;
}

.chatbot-input:focus {
  outline: none;
  border-color: #6366f1;
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
}

.btn-send {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: white;
  border: none;
  border-radius: 12px;
  padding: 0.75rem 1.25rem;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn-send:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
}

@media (max-width: 768px) {
  .chatbot-widget {
    width: calc(100% - 40px);
    right: 20px;
    bottom: 20px;
  }
}
</style>

<script>
let chatbotCollapsed = false;

function toggleChatbot() {
  chatbotCollapsed = !chatbotCollapsed;
  const body = document.getElementById('chatbotBody');
  const toggle = document.getElementById('chatbotToggle');
  
  if (chatbotCollapsed) {
    body.classList.add('collapsed');
    toggle.textContent = '+';
  } else {
    body.classList.remove('collapsed');
    toggle.textContent = '–';
  }
}

function sendChatMessage() {
  const input = document.getElementById('chatbotInput');
  const message = input.value.trim();
  
  if (!message) return;
  
  // Add user message
  addMessage(message, 'user');
  input.value = '';
  
  // Get outfit context from page
  const outfitContext = {
    colors: {{ img_report.get('colors', []) | tojson }},
    items: {{ img_report.get('items', []) | tojson }},
    trend_status: '{{ trend_status if trend_status else "Unknown" }}'
  };
  
  // Send to backend
  fetch('/chat', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({
      message: message,
      outfit_context: outfitContext
    })
  })
  .then(response => response.json())
  .then(data => {
    addMessage(data.response, 'bot');
  })
  .catch(error => {
    addMessage('Sorry, I encountered an error. Please try again.', 'bot');
  });
}

function addMessage(text, sender) {
  const messagesDiv = document.getElementById('chatbotMessages');
  const messageDiv = document.createElement('div');
  messageDiv.className = `message ${sender}-message`;
  
  const avatar = sender === 'bot' ? '🤖' : '👤';
  
  messageDiv.innerHTML = `
    <div class="message-avatar">${avatar}</div>
    <div class="message-content">
      <p style="margin: 0; white-space: pre-wrap;">${text}</p>
    </div>
  `;
  
  messagesDiv.appendChild(messageDiv);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

// Enter key to send
document.addEventListener('DOMContentLoaded', function() {
  const input = document.getElementById('chatbotInput');
  if (input) {
    input.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        sendChatMessage();
      }
    });
  }
});
</script>
